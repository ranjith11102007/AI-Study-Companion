# PostgreSQL + pgvector only.
# Start:  docker compose up -d
# Stop:   docker compose down
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-study-companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studymate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studymate}
      POSTGRES_DB: ${POSTGRES_DB:-studymate}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studymate} -d ${POSTGRES_DB:-studymate}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
