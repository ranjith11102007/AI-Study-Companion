<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Mastery Progress · StudyMate AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind styling (inherited from layout) -->
</head>
<body class="bg-surface text-on-surface antialiased min-h-full flex flex-col">

  <!-- Header (simplified version of original shell) -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-sm">
    <div class="h-16 px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="font-bold">StudyMate AI</span>
        <span>Mastery Progress</span>
      </div>
    </div>
  </header>

  <!-- Main content area -->
  <main class="flex-1 flex flex-col relative w-full pt-20 pb-20 bg-surface px-4">
    <div class="flex flex-col w-full pb-6 space-y-4">

      <!-- Dynamic course info -->
      <div class="bg-surface-container-low px-4 py-3 rounded-xl shadow-sm">
        <h2 class="font-label-lg" id="course-title">Loading course...</h2>
      </div>

      <!-- Empty state illustration -->
      <div id="empty-state" class="text-center py-12 space-y-4">
        <p class="text-on-surface-variant font-body-md">No mastery data yet.</p>
        <p class="text-on-surface-variant font-body-sm">Complete an assessment to build your learning profile.</p>
      </div>

      <!-- Container for dynamic content (hidden by default) -->
      <div id="mastery-content" class="space-y-4 hidden">
        <!-- Content placeholders will be filled by backend data -->
      </div>

    </div>
  </main>

  <script>
    // Logic to fetch and render dynamic data
    async function loadMastery() {
      // NOTE: This will need to be connected to real API endpoints
      // e.g., StudyAPI.fetchMasteryData(courseId);
      console.log("Fetching real mastery data...");

      // For now, demonstrate the empty state
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('mastery-content').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', loadMastery);
  </script>
</body>
</html>
