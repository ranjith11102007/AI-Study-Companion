[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests app/tests
pythonpath = .
# DB-backed tests may hit a remote Postgres pooler; retry transient connection
# drops (getaddrinfo failed / ConnectionDoesNotExistError). See docs/testing.md.
addopts = --reruns 2 --reruns-delay 3
