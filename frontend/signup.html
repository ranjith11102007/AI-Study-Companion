<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · StudyMate AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-shell="bare" data-page="signup">

  <main class="auth">
    <!-- The shared promotional panel is rendered by js/shell.js for every
         auth page, so login and sign up stay pixel-identical. -->
    <div class="auth-main">
      <div class="auth-card">
        <span class="t-eyebrow">Get started</span>
        <h1 class="mt-sm">Create account</h1>
        <p class="auth-sub">Join your local study workspace.</p>

        <form class="auth-form" id="signup-form" novalidate>
          <div class="field">
            <label class="field-label" for="signup-name">Full Name <span class="req">*</span></label>
            <div class="input-group">
              <span class="input-icon" data-icon="user"></span>
              <input class="input" type="text" id="signup-name" name="name" placeholder="John Doe" autocomplete="name" required />
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="signup-email">Email <span class="req">*</span></label>
            <div class="input-group">
              <span class="input-icon" data-icon="user"></span>
              <input class="input" type="email" id="signup-email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="signup-password">Password <span class="req">*</span></label>
            <div class="input-group">
              <span class="input-icon" data-icon="lock"></span>
              <input class="input" type="password" id="signup-password" name="password" placeholder="••••••••" autocomplete="new-password" required />
            </div>
          </div>

          <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>

          <a class="btn btn-ghost btn-block" id="google-btn" href="/api/auth/google/start">
            <span data-icon="compass"></span> Continue with Google
          </a>
          <div class="banner banner-plain" id="oauth-note" hidden style="font-size:12px">
            <span data-icon="info"></span>
            <div id="oauth-note-text"></div>
          </div>
        </form>

        <script>
          (function () {
            try {
              fetch("/api/auth/providers").then(function (r) { return r.json(); })
                .then(function (p) {
                  if (!p || !p.google_oauth_enabled) {
                    var btn = document.getElementById("google-btn");
                    if (btn) btn.hidden = true;
                    var note = document.getElementById("oauth-note");
                    var nt = document.getElementById("oauth-note-text");
                    if (note && nt) {
                      nt.textContent = "Google sign-in is not configured on this server.";
                      note.hidden = false;
                    }
                  }
                }).catch(function () {});
            } catch (e) {}
          })();
        </script>
        <p class="auth-alt">
          Already have an account?
          <a href="login.html">Sign in</a>
          · <a href="index.html">Back to home</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/health.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
